spring:
  application:
    name: newerp
  # Optional file with your local passwords; it is in .gitignore. See application-local.example.yml.
  config:
    import: optional:file:./application-local.yml,optional:file:../application-local.yml
  datasource:
    url: ${NEWERP_DB_URL:jdbc:mysql://localhost:3306/newerp_dev}
    username: ${NEWERP_DB_USER:newerp}
    password: ${NEWERP_DB_PASSWORD:}
  jackson:
    deserialization:
      # A missing number in JSON is 0, like in .NET (Jackson 3 would reject it by default)
      fail-on-null-for-primitives: false
  jpa:
    # Database-first: Hibernate only checks that entities match the tables, it never changes the schema.
    hibernate:
      ddl-auto: validate
    # No lazy loading while the JSON is written: queries stay inside services.
    open-in-view: false
  mvc:
    # Query parameters like ?from=2026-10-01 are ISO dates
    format:
      date: iso
      date-time: iso

# The Vaadin UI lives under /ui/ (the Blazor UI stays under /app/, the API at the root)
vaadin:
  url-mapping: /ui/*

# Session cookie, same rules as the .NET auth cookie
server:
  servlet:
    session:
      timeout: 8h # idle time: while the user works, the session goes on (sliding expiration)
      cookie:
        name: newerp.auth
        http-only: true # JavaScript on the page cannot read it
        same-site: strict # other sites cannot send requests on the user's behalf (CSRF protection)

# /health like the .NET version (includes a database check)
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

# Same settings as appsettings.json in the .NET version
erp:
  language-id: 3
bonus:
  percent: 1.0
  counted-status-ids: [22, 20]
stock:
  reorder-target-factor: 2
production:
  order-subtract-status-ids: [18, 20, 21, 22, 23, 25]
  # Active orders for the sewing plan (GET /production/plan)
  plan-status-ids: [1, 17, 18, 23, 24, 25]
# No API keys here: without a key the stub client is used and nothing reaches Nova Poshta.
# Keys and senders go to application-local.yml (see application-local.example.yml).
nova-poshta:
  fake-documents: false
# Checkbox: the same, cashier keys only in application-local.yml. Open shifts are checked every 15 minutes (0: never).
checkbox:
  fake-receipts: false
  auto-close-interval-minutes: 15

# How often what was sold ahead is taken off the pre-order quotas (minutes); 0: only by POST /preorders/settle.
pre-orders:
  settle-interval-minutes: 60

# The order of products by sales (the old "Порядок товарів" module); values as in the old site's code
product-sort:
  counted-status-ids: [17, 18, 21, 22, 23, 24, 25]
  excluded-user-ids: [13]
  excluded-order-markers: ["B2B"]
  excluded-comment-markers: ["б2б", "магаз", "партнер"]
  color-filter-ids: [156, 157, 158, 159]
  tag-filter-group-id: 7
  new-label-name: Новинка
  default-days: 90

# Birthday greetings: the coupon's discount and term, the pickup city, a pause between bulk SMS
marketing:
  birthday-discount-percent: 20
  birthday-coupon-days: 30
  pickup-city: Львів
  pickup-method-marker: амовив
  bulk-sms-delay-milliseconds: 300

# The header of the partners' XML feeds; a photo in a feed is {store-url}image/{path}
partner-feed:
  shop-name: Vidro
  company: ""
  store-url: ""

# PrivatBank statement and LiqPay: accounts and keys only in application-local.yml or environment variables.
privat-bank:
  base-url: https://acp.privatbank.ua
liq-pay:
  base-url: https://www.liqpay.ua

# SMSClub: the token only in application-local.yml or SMS_CLUB_TOKEN; without it the stub sends nothing.
# only-phones: a list of numbers (380XXXXXXXXX) to send to, for checks on a local database.
sms-club:
  base-url: https://im.smsclub.mobi
  sender: Vidro.ua

# API docs: /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
