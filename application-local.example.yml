# Copy this file to application-local.yml (same folder) and put your real password there.
# application-local.yml is in .gitignore, so it never reaches GitHub.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/newerp_dev
    username: newerp
    password: put_your_password_here

# Nova Poshta. Without a key a stub is used; fake-documents: true lets it "create" test waybills (numbers start with 00).
nova-poshta:
